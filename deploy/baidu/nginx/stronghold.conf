# Stronghold Protocol — 百度轻量服务器反代（v3: sync.sh 自动落盘 + reload）
# 上游：systemd stronghold.service，HOST=127.0.0.1 PORT=3000
upstream stronghold_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    # 8443 已于 2026-10-29 让出：该端口被 /etc/nginx/conf.d/astrbot.conf 占用
    # （listen 8443 ssl，QQ 机器人 AstrBot 的站点）。同一端口上 SSL server 会成为默认
    # server，明文请求会被回 400 "plain HTTP request was sent to HTTPS port"。
    # 显式点名游戏域名（另有 _ 兜底 IP 直连/其他 Host）
    # 注意：该域名在**大陆直连**下会被百度备案网关按 Host 拦（302 到 domainwall），
    # 与 nginx 无关；对外可用路径是 CF 隧道（cloudflared ingress 已配 supercup → 127.0.0.1:80）。
    server_name supercup.jiangjiangze.icu _;

    # /studio 有 Host 白名单（仅本机/内网，server/studio/gate.js），公网不暴露
    location /studio {
        return 404;
    }

    # /mod 暂不开放（2026-10-28 用户决定）
    # 原因：允许 210MB zip 上传，而服务跑在 SP_PLUGIN_SCRIPTS=trusted-force，
    # trusted 插件在服务端执行 ⇒ 上传插件 ≈ 远程命令执行。
    # 若日后要开放浏览（不开放上传），把 return 403 换成：
    #     client_max_body_size 210m;
    #     proxy_pass http://stronghold_app;  ...
    #     limit_except GET HEAD { deny all; }
    location /mod {
        return 403;
    }

    # WebSocket：长连接；应用层已开 permessage-deflate（server/http/websocket.js:134）
    # 不要剥离 Sec-WebSocket-Extensions，让它原样透传
    location /ws {
        proxy_pass http://stronghold_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://stronghold_app;
        proxy_http_version 1.1;
        # 用 $http_host 而不是 $host：$host 会丢端口，
        # 非标端口（8443）下重定向会把用户甩回被备案网拦掉的 80
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        # cdn-local 会把本机缺失的 /assets|/fonts|/media 302 到 CDN
        # 必须原样下发 302，不跟随、不改写 Location
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
