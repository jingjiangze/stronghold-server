# /etc/nginx/nginx.conf —— 整份替换（Rocky 9 默认版带一个 listen 80 default_server 的
# server 块，会和 conf.d/stronghold.conf 抢默认站点，所以这里不用它）
# 安装前先备份：cp -a /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak-$(date +%Y%m%d-%H%M%S)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # WebSocket 升级映射（/ws 使用）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 应用层自己按 Accept-Encoding 协商 br/gzip（server/http/files.js:294,315）
    # 这里全局关闭，避免二次压缩
    gzip off;
    gzip_static off;

    include /etc/nginx/conf.d/*.conf;
}
