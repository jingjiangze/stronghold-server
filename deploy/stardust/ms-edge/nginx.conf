# 创空间容器的边缘层：只做一件事——把素材请求 302 到当前源，字节从不经过这个容器。
#
# 为什么 nginx 占 7860 而不是另开端口：创空间把对外端口写死成 7860（deploy_schema.json
# 的 port.const），容器里没有第二个公网口。所以三个进程共用这一个口，按路径分流——这与
# Stardust 的 compose 同构（游戏 3120 / 素材解析器 3130 / 一个 nginx 在前面）。
#
# 这里**不用 Lua**：素材的判定在 edge-sidecar.mjs 里（Stardust 的 openi-resolver 也是这个
# 形状）。少一个动态模块就少一类「配置写错导致 nginx 起不来」，而且那段逻辑能用 node --test
# 直接测。nginx 只做两件事：按路径分流，和 sidecar 挂掉时自己跳主源。

worker_processes auto;
# 非 root（镜像里是 USER node）需要一个可写的 pid 与临时目录
pid /app/.sp-edge/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /app/.sp-edge/client_body;
    proxy_temp_path /app/.sp-edge/proxy;
    fastcgi_temp_path /app/.sp-edge/fastcgi;
    uwsgi_temp_path /app/.sp-edge/uwsgi;
    scgi_temp_path /app/.sp-edge/scgi;

    # 构建期由 render-nginx.mjs 从 sources.json 生成：定义 $sp_fallback_base。
    # 为什么生成而不是写死：下面有两个地方要用同一个基址（sidecar 兜底 + 字体重定向），
    # 手写第二份会在换 release pin 时漂移。
    include /app/deploy/stardust/ms-edge/sources-nginx.conf;

    upstream sp_game {
        server 127.0.0.1:3120;
        keepalive 32;
    }
    upstream sp_edge {
        server 127.0.0.1:3130;
        keepalive 16;
    }
    # 促融共竞（Icebreaker）：独立的 Node 进程，只在内部口上；挂在前缀 /icebreaker/ 下。
    upstream sp_icebreaker {
        server 127.0.0.1:8700;
        keepalive 16;
    }

    # WebSocket 与普通请求共用一个 server，靠这两个 map 决定 Upgrade 头
    map $http_upgrade $sp_connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;
        server_name _;

        # 素材树：本容器不持有这些字节，交给 sidecar 决定 302 去哪。
        # 注意整棵树都交给它（不在这里再列一遍扩展名白名单）：白名单只存在于 sidecar 一处，
        # 两处列表迟早会不一致。sidecar 对不该跳的路径回 404，与加边缘层之前游戏本体的行为一致。
        # 素材树：交给游戏本体（server/http/asset-jump.js）。它持有 ModelScope 会话，能把私有数据集的
        # 路径换成一次性的签名直链；nginx 这里不再自己发 302（那条地址匿名浏览器读不了）。
        location ~ ^/(assets|fonts)/ {
            proxy_pass http://sp_game;
            proxy_set_header Accept-Encoding "gzip";
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # 促融共竞（Icebreaker）：官方部署形态就是挂在反向代理的子路径下（docs/deploy.md §4），
        # 前缀由这里剥掉——proxy_pass 结尾的 / 负责这件事，服务器不需要知道前缀（站点-1：前缀之外什么也不请求）。
        # 大厅与对局都是 WebSocket，所以照抄下面 location / 的 Upgrade 头；读超时给到 1h（对局可能很长）。
        # client_max_body_size：mod 管理器一次最多收 32 MiB 的 zip，nginx 默认 1m 会把上传打成 413。
        location = /icebreaker { return 301 /icebreaker/; }
        location /icebreaker/ {
            # 注意（已知限制）：这里沿用下面 location / 的写法，把 X-Real-IP 改写成代理看到的地址。
            # 如果创空间/WAF 前面还有一层（玩家 → 平台代理 → 容器），全体玩家在 Icebreaker 的按地址限流里
            # 会被算成同一个地址（站点-2：每地址 24 条 WebSocket、一分钟 10 次错房号）。要不要用 real_ip 还原，
            # 取决于平台到底给不给 X-Forwarded-For —— 上线后在容器里验一次再改，别拿构建成败去赌模块在不在。
            proxy_pass http://sp_icebreaker/;
            proxy_set_header Accept-Encoding "gzip";
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sp_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
            client_max_body_size 34m;
        }

        # 其余一切（页面、/data/**、/js/**、/vendor/**、/media/**、/ws、/healthz）都还是游戏本体。
        # /media/** 刻意留给游戏：它自己有 /media/bgm/x → /assets/audio/bgm/x.mp3 的映射，
        # 挪到这边就得复刻那条映射，多一处可能不一致的地方而没有收益。
        location / {
            proxy_pass http://sp_game;
            proxy_set_header Accept-Encoding "gzip";
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sp_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
