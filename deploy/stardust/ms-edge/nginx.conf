# 创空间容器的边缘层：只做一件事——把素材请求 302 到当前源，字节从不经过这个容器。
#
# 为什么 nginx 占 7860 而不是另开端口：创空间把对外端口写死成 7860（deploy_schema.json
# 的 port.const），容器里没有第二个公网口。所以游戏本体退到 127.0.0.1:3000，公网只看到
# 一个口，按路径分流。
#
# 用 nginx + lua 模块而不是 OpenResty：官方 OpenResty 没有 Windows 构建，alpine 仓库里
# nginx-mod-http-lua 就是同一套 lua-nginx-module（OpenResty = nginx + 该模块 + LuaJIT）。

worker_processes auto;
# 非 root（镜像里是 USER node）需要一个可写的 pid 与临时目录
pid /tmp/sp-edge/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/sp-edge/client_body;
    proxy_temp_path /tmp/sp-edge/proxy;
    fastcgi_temp_path /tmp/sp-edge/fastcgi;
    uwsgi_temp_path /tmp/sp-edge/uwsgi;
    scgi_temp_path /tmp/sp-edge/scgi;

    lua_package_path '/app/deploy/stardust/ms-edge/?.lua;;';
    lua_shared_dict sp_edge 1m;

    upstream sp_game {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # WebSocket 与普通请求共用一个 server，靠这两个 map 决定 Upgrade 头
    map $http_upgrade $sp_connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;
        server_name _;

        # 素材树：本容器不持有这些字节，交给边缘层决定 302 去哪。
        # lua 只在能明确分流时接管；形态可疑或不属于这两棵树的一律落到下面的兜底，
        # 由游戏本体按原样处理（返回 404，与加边缘层之前完全一致）。
        location ~ ^/(assets|fonts)/ {
            access_by_lua_file /app/deploy/stardust/ms-edge/edge.lua;

            proxy_pass http://sp_game;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 其余一切（页面、/data/**、/js/**、/vendor/**、/ws、/healthz）都还是游戏本体。
        location / {
            proxy_pass http://sp_game;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sp_connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
