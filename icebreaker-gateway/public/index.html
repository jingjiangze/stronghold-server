<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0c0f0e" />
<meta name="referrer" content="no-referrer" />
<title>促融共竞 · ICEBREAKER GAMES</title>
<link rel="icon" href="https://jingjiangze-stronghold-protocol.ms.show/icebreaker/icons/favicon.ico" />
<link rel="preconnect" href="https://jingjiangze-stronghold-protocol.ms.show" />
<style>
  html, body { margin: 0; height: 100%; background: #0c0f0e; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; z-index: 1; }
</style>
</head>
<body>
<!-- 默认 src 保证无 JS 也能进游戏；下面的脚本再按深链覆盖（如 /room/CODE）。
     与 superbig 外壳的唯一差别：GAME_PREFIX = '/icebreaker/' —— iframe 目标带前缀，
     而 origin 不变，所以 CSP 的 frame-src / connect-src 一条都不用改。 -->
<iframe id="app"
        src="https://jingjiangze-stronghold-protocol.ms.show/icebreaker/"
        title="促融共竞"
        allow="fullscreen; autoplay; clipboard-write; gamepad; screen-wake-lock"
        allowfullscreen
        referrerpolicy="no-referrer"></iframe>
<script>
  (function () {
    var GAME_ORIGIN = 'https://jingjiangze-stronghold-protocol.ms.show';
    // Icebreaker 挂在这个容器的子路径下；前缀之外的地址与 superbig 完全一样。
    var GAME_PREFIX = '/icebreaker';
    var frame = document.getElementById('app');

    // 深链透传（静态托管改为客户端完成）：/ 与 /room/CODE 这类路径/查询串原样带给游戏，
    // 只是先拼上前缀。引号/尖括号百分号转义，避免拼进 src 时破口（与 superbig 版同一策略）。
    var path = location.pathname === '/' ? '/' : location.pathname;
    var target = (GAME_ORIGIN + GAME_PREFIX + path + location.search)
      .replace(/[<>"']/g, function (c) { return '%' + c.charCodeAt(0).toString(16).toUpperCase(); });
    if (target !== frame.src) frame.src = target;

    // 页面不显示任何加载/失败文案（沿用 superbig 的口径）：诊断只写控制台。
    setTimeout(function () {
      fetch('/healthz', { cache: 'no-store', referrerPolicy: 'no-referrer' })
        .then(function (r) { console.info('[icebreaker] 12s 未载入；healthz ok=' + r.ok); })
        .catch(function () { console.info('[icebreaker] 12s 未载入；healthz 不可达'); });
    }, 12000);
  })();
</script>
</body>
</html>
