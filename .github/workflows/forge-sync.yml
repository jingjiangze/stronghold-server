name: Forge Mod 管理器每日同步

# 目标：每 6 小时检测 Forge（Stronghold-Protocol-Forge）最新构建/Release，
# 仅在检测到源码 SHA 或 Release tag 变化时，于 stronghold-server 生成候选分支 + 集成 PR。
# 原则：不覆盖服务器自有文件；只更新 mod 桥接目录与基线记录；失败保留现场，不自动合入生产。

on:
  schedule:
    # 每天约 4 次（UTC）：避开整点。对应北京 07:00 / 13:00 / 19:00 / 01:00。
    - cron: '7 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      forge_ref:
        description: 'Forge 分支（默认 main）'
        required: false
        default: 'main'
      forge_repo:
        description: 'Forge 仓库（默认 XiaMo233M/Stronghold-Protocol-Forge）'
        required: false
        default: 'XiaMo233M/Stronghold-Protocol-Forge'
      force:
        description: '即使无变化也生成候选分支'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-sync
  cancel-in-progress: false

env:
  FORGE_REPO: ${{ github.event.inputs.forge_repo || 'XiaMo233M/Stronghold-Protocol-Forge' }}
  FORGE_REF: ${{ github.event.inputs.forge_ref || 'main' }}
  BASELINE_PATH: var/forge-baseline.json

jobs:
  detect-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server (main)
        uses: actions/checkout@v4
        with:
          repository: jingjiangze/stronghold-server
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 探测 Forge 最新 main SHA 与最新 Release
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::probe forge"
          # 最新 main SHA
          FORGE_SHA=$(git ls-remote --heads "https://github.com/${FORGE_REPO}.git" "${FORGE_REF}" \
            | awk '{print $1}')
          if [ -z "${FORGE_SHA}" ]; then
            echo "::error::无法解析 Forge ${FORGE_REPO}@${FORGE_REF} 的 SHA"
            exit 1
          fi
          # 最新正式 Release tag（按发布时间取最新；无 Release 则置空）
          FORGE_TAG=$(gh release list --repo "${FORGE_REPO}" --limit 1 --json tagName \
            | jq -r '.[0].tagName // ""' || true)
          echo "forge_sha=${FORGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "forge_tag=${FORGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Forge main SHA: ${FORGE_SHA}"
          echo "Forge latest release tag: ${FORGE_TAG:-<none>}"
          echo "::endgroup::"

      - name: 读取上次基线
        id: baseline
        run: |
          set -euo pipefail
          if [ -f "${BASELINE_PATH}" ]; then
            PREV_SHA=$(jq -r '.forgeSha // ""' "${BASELINE_PATH}")
            PREV_TAG=$(jq -r '.forgeTag // ""' "${BASELINE_PATH}")
          else
            PREV_SHA=""
            PREV_TAG=""
            mkdir -p var
          fi
          echo "prev_sha=${PREV_SHA}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous baseline: sha=${PREV_SHA:-<none>} tag=${PREV_TAG:-<none>}"

      - name: 判定是否变化
        id: changed
        run: |
          set -euo pipefail
          CUR_SHA="${{ steps.probe.outputs.forge_sha }}"
          CUR_TAG="${{ steps.probe.outputs.forge_tag }}"
          PREV_SHA="${{ steps.baseline.outputs.prev_sha }}"
          PREV_TAG="${{ steps.baseline.outputs.prev_tag }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "changed=true (force)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${CUR_SHA}" != "${PREV_SHA}" ] || [ "${CUR_TAG}" != "${PREV_TAG}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false (no change)" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取 Forge 工作树（只读参考）
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "::group::fetch forge tree"
          git clone --depth 1 --branch "${FORGE_REF}" \
            "https://github.com/${FORGE_REPO}.git" /tmp/forge-tree
          echo "::endgroup::"

      - name: 生成候选分支与桥接更新
        if: steps.changed.outputs.changed == 'true'
        id: branch
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          SHORT=$(echo "${{ steps.probe.outputs.forge_sha }}" | cut -c1-12)
          BRANCH="forge-sync/${DATE}-${SHORT}"
          git checkout -b "${BRANCH}"
          # 桥接目录：只放 Forge 的 Mod 契约/管理工具子集（不覆盖服务器自有文件）。
          # 具体落地内容由阶段2定义；此处先写入基线记录与占位说明，保证 PR 可开。
          mkdir -p mod-bridge
          cat > "${BASELINE_PATH}" <<EOF
          {
            "forgeRepo": "${FORGE_REPO}",
            "forgeRef": "${FORGE_REF}",
            "forgeSha": "${{ steps.probe.outputs.forge_sha }}",
            "forgeTag": "${{ steps.probe.outputs.forge_tag }}",
            "syncedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "note": "自动同步候选；未覆盖服务器自有文件，仅更新 mod-bridge 与基线。"
          }
          EOF
          git config user.name "forge-sync[bot]"
          git config user.email "forge-sync[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(forge-sync): 候选 ${DATE} @ ${SHORT}

          Forge ${FORGE_REPO}@${FORGE_REF}
          - source SHA: ${{ steps.probe.outputs.forge_sha }}
          - latest release: ${{ steps.probe.outputs.forge_tag || '(none)' }}
          - prev SHA: ${{ steps.baseline.outputs.prev_sha || '(none)' }}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: 推送候选分支
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push --no-force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jingjiangze/stronghold-server.git" \
            "HEAD:${{ steps.branch.outputs.branch }}"

      - name: 开集成 PR（人工审查，不自动合）
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY="## Forge 每日同步候选

          - 源仓库: \`${FORGE_REPO}\` @ \`${FORGE_REF}\`
          - 源码 SHA: \`${{ steps.probe.outputs.forge_sha }}\`
          - 最新 Release: ${{ steps.probe.outputs.forge_tag || '(none)' }}
          - 上次基线 SHA: ${{ steps.baseline.outputs.prev_sha || '(none)' }}

          ### 处置原则
          - 不覆盖服务器自有文件；仅更新 \`mod-bridge/\` 与基线记录。
          - 无 Mod 时行为须与改造前一致（阶段2 验收）。
          - 匹配系统（MatchmakeQueue）保留服务器实现，不引入 Forge 状态机。
          - 反馈 QQ 群已在服务器侧移除（见审计方案）。
          - 公告为大厅独立按钮。

          ### 检查清单（合入前人工）
          - [ ] 契约测试通过
          - [ ] \`npm test\` 全绿
          - [ ] 无 Mod 时 golden 测试无回归
          - [ ] 未误覆盖服务器 B 类改动

          /hold"
          gh pr create \
            --repo jingjiangze/stronghold-server \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "forge-sync: ${{ steps.branch.outputs.branch }}" \
            --body "${BODY}"

      - name: 无变化跳过
        if: steps.changed.outputs.changed == 'false'
        run: echo "Forge 无变化（SHA/tag 与基线一致），跳过本次同步。"
