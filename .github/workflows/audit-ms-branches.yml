name: audit-ms-branches

# 一次性只读审计：列出创空间 jingjiangze/Stronghold-Protocol 现存分支的内容轮廓，
# 供「删掉用不到的分支」之前确认里面没有需要保留的东西。
#
# 为什么必须走 Actions：创空间公网 git 端点要求 Basic 认证（匿名 ls-remote 只能列 ref，
# clone/fetch 报 "Access denied"），而 MS_TOKEN 只存在在这个仓库的 Secrets 里。
#
# 只读：只 fetch + ls-tree + log，不 push 任何东西。删除是另一个 workflow 的事。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: list branches
        env:
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/jingjiangze/Stronghold-Protocol.git"
          echo "=== 分支清单 ==="
          git ls-remote --heads "$URL"

      - name: inventory each branch
        env:
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/jingjiangze/Stronghold-Protocol.git"
          for b in master cdn stardust-server; do
            echo ""
            echo "###################### 分支 $b ######################"
            sha=$(git ls-remote "$URL" "refs/heads/$b" | cut -f1)
            if [ -z "$sha" ]; then echo "（不存在）"; continue; fi
            echo "HEAD = $sha"
            rm -rf "/tmp/aud-$b"
            if ! git clone --filter=blob:none --no-checkout --single-branch --branch "$b" "$URL" "/tmp/aud-$b" 2>/dev/null; then
              echo "clone 失败（权限或网络）"; continue
            fi
            cd "/tmp/aud-$b"
            echo "--- 最近 3 条提交 ---"
            git log --oneline -3 2>/dev/null || true
            echo "--- 提交时间 ---"
            git log -1 --format='author=%an date=%ai' 2>/dev/null || true
            echo "--- 提交总数 ---"
            git rev-list --count HEAD 2>/dev/null || true
            echo "--- 顶层条目 ---"
            git ls-tree HEAD 2>/dev/null | head -30
            echo "--- 文件总数 / blob 合计字节 ---"
            git ls-tree -r -l HEAD 2>/dev/null | awk '
              /\t/ { n++; split($0, a, " "); sz=a[4]+0; tot+=sz }
              END { printf "文件数=%d  合计=%.1f MiB\n", n, tot/1048576 }'
            cd - >/dev/null
          done
