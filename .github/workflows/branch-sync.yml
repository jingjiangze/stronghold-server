name: branch-sync

# 分支模型（2026-10-29 翻转：**百度为主**）
#   baidu = 主干，运行时内容 + deploy/baidu/**
#   ms    = 由 baidu 派生：baidu 的 tree 去掉 deploy/baidu/**
#   方向：baidu ──> ms ──> 魔搭（见 push-to-modelscope.yml）
#
# 为什么放在 Actions：本机到 GitHub 的 git 协议不通（直连不可达、代理被 reset），
# 只有 runner 上有真实推送能力。

on:
  push:
    branches: [baidu, ms]
  workflow_dispatch:
    inputs:
      mode:
        description: '执行哪个动作'
        type: choice
        options: [guard, sync-ms]
        default: guard

permissions:
  contents: write
  # GITHUB_TOKEN 推的 commit 不会触发下游 workflow（GitHub 防循环），
  # 所以镜像完 ms 后要显式 dispatch push-to-modelscope
  actions: write

concurrency:
  group: branch-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'guard')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 守卫 —— 插件跟踪（b4754eae 类事故的门禁）
        run: |
          git fetch origin baidu --force
          git checkout -q --detach origin/baidu
          node tools/check-plugin-tracked.mjs

      - name: 守卫 —— ms 只能是 baidu 去掉 deploy/baidu
        # 判据用「提交」而不是「文件」：baidu 领先 ms 是正常的（sync-ms 稍后追平），
        # 真正违规的是 ms 上存在 baidu 没有、且动了 deploy/baidu 之外路径的提交。
        run: |
          set -euo pipefail
          git fetch origin baidu ms --force
          VIOL=$(git log origin/baidu..origin/ms --oneline -- . ':(exclude)deploy/baidu' || true)
          if [ -n "$VIOL" ]; then
            echo "::error::ms 上有 baidu 没有的运行时提交（ms 应完全由 baidu 派生）："
            echo "$VIOL"
            echo "::error::处理：dispatch 本 workflow，mode=sync-ms 重建 ms"
            exit 1
          fi
          echo "OK: ms 没有 baidu 之外的运行时提交"
          BEHIND=$(git rev-list --count origin/ms..origin/baidu || echo 0)
          echo "baidu 领先 ms ${BEHIND} 个提交（>0 属正常，sync-ms 会自动追平）"

  sync-ms:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/baidu') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync-ms')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 设置提交身份
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: 重建 ms = baidu 去掉 deploy/baidu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin baidu ms --force
          BAIDU=$(git rev-parse origin/baidu)
          MS=$(git rev-parse origin/ms)

          # 安全闸门：ms 上若有 baidu 没有的运行时提交，重建会抹掉它们
          HOTFIX=$(git log "$BAIDU".."$MS" --oneline -- . ':(exclude)deploy/baidu' || true)
          if [ -n "$HOTFIX" ]; then
            echo "::error::ms 上有 baidu 没有的运行时提交，重建会丢失，已中止："
            echo "$HOTFIX"
            exit 1
          fi

          tmp=$(mktemp -d); export GIT_INDEX_FILE="$tmp/index"
          git read-tree "$BAIDU"
          git ls-tree -r "$BAIDU" -- deploy/baidu | while read -r mode type sha path; do
            git update-index --force-remove "$path"
          done
          NEWTREE=$(git write-tree)
          rm -rf "$tmp"; unset GIT_INDEX_FILE

          if [ "$NEWTREE" = "$(git rev-parse "$MS^{tree}")" ]; then
            echo "ms 已是最新，无需重建"; exit 0
          fi
          NEWCOMMIT=$(git commit-tree "$NEWTREE" -p "$BAIDU" \
            -m "sync(ms): 镜像 baidu $(git rev-parse --short "$BAIDU")（去掉 deploy/baidu）")
          echo "新 ms commit: $NEWCOMMIT"
          git push origin "$NEWCOMMIT:refs/heads/ms"
          # 显式触发下游（GITHUB_TOKEN 推送不触发 push 型 workflow）
          gh workflow run push-to-modelscope.yml --ref ms
          echo "已 dispatch push-to-modelscope"
