name: sync-from-ms

# ⚠️ 2026-10-29 起主从翻转：**百度/GitHub baidu 是主干，魔搭是下游**。
# 本 workflow 的定时 schedule 已停用 —— 否则它会定期把魔搭的旧内容拉回来覆盖主干改动。
# 保留 workflow_dispatch 仅供「抢救」：万一主干丢了、需要把魔搭现网内容拉回来时手动跑一次。
#
# 现行方向：本机 → GitHub baidu ──(branch-sync)──> ms ──(push-to-modelscope)──> 魔搭

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-from-ms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 设置提交身份
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: 拉取魔搭线上（深度 1，带 blob，保证能往 GitHub 推）
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MODELSCOPE_TOKEN:-}" ]; then
            echo "::error::缺少 secret MODELSCOPE_TOKEN"; exit 1
          fi
          git remote add msrc "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/studios/jingjiangze/Stronghold-Protocol.git"
          git fetch --depth 1 msrc master
          SRC=$(git rev-parse FETCH_HEAD)
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "魔搭线上: $(git rev-parse --short "$SRC")  tree=$(git rev-parse --short "$SRC^{tree}")"
          N=$(git ls-tree -r "$SRC" | wc -l)
          echo "文件数: $N"
          if [ "$N" -lt 1000 ]; then
            echo "::error::魔搭内容异常（文件数 $N < 1000），中止"; exit 1
          fi

      - name: 拉回到 baidu（主干）
        run: |
          set -euo pipefail
          git fetch origin baidu --force
          BAIDU=$(git rev-parse origin/baidu)

          # 比内容，排除 .github/（GitHub 侧独有）
          git ls-tree -r "$SRC" | awk -F'\t' '$2 !~ /^\.github\//' | sort > /tmp/src.txt
          git ls-tree -r "$BAIDU" | awk -F'\t' '$2 !~ /^\.github\// && $2 !~ /^deploy\/baidu\//' | sort > /tmp/dst.txt
          if diff -q /tmp/src.txt /tmp/dst.txt > /dev/null; then
            echo "内容已一致（魔搭 $(git rev-parse --short "$SRC")）"; exit 0
          fi
          echo "--- 差异（< 魔搭 / > baidu）---"
          diff /tmp/src.txt /tmp/dst.txt | head -40 || true

          # 以魔搭内容为底树，再把 .github/ 与 deploy/baidu/ 从 baidu 保留回来
          git read-tree "$SRC"
          git ls-tree -r "$BAIDU" -- .github deploy/baidu | while read -r mode type sha path; do
            git update-index --add --cacheinfo "$mode,$sha,$path"
          done
          NEWTREE=$(git write-tree)
          if [ "$NEWTREE" = "$(git rev-parse "$BAIDU^{tree}")" ]; then
            echo "合成树与现 baidu 相同，无需推送"; exit 0
          fi
          NEWCOMMIT=$(git commit-tree "$NEWTREE" -p "$BAIDU" \
            -m "recover(baidu): 从魔搭线上拉回 $(git rev-parse --short "$SRC")")
          git push origin "$NEWCOMMIT:refs/heads/baidu"
          echo "已推送到 baidu，branch-sync 会自动镜像到 ms"
